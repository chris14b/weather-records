name: Update

on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Not `pages`: the deploy this calls uses that group, and would wait on this run.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:data
      - id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add data/recent data/ftp-history src/site/public/facts.json
          if ! git diff --cached --quiet; then
            git commit --quiet -m "Update the data at $(TZ=Australia/Sydney date '+%-d %b %Y %-I:%M%P')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.ref }}
