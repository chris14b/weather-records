name: Schedule test

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "5-55/10 * * * *"
      timezone: "Australia/Sydney"
    - cron: "40 21 * * *"
      timezone: "Australia/Sydney"

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Fired by '${{ github.event.schedule }}' at $(date -u)"
